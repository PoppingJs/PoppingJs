<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="PoppingJs - NPI. Exploring technology, art, and the craft of turning ideas into products."
    />
    <title>PoppingJs | NPI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="ambient" aria-hidden="true">
      <span></span>
      <span></span>
      <span></span>
    </div>

    <header class="site-header">
      <a class="brand" href="#top" aria-label="PoppingJs 首页">
        <span class="brand-mark">P</span>
        <span>PoppingJs</span>
      </a>
      <nav class="site-nav" aria-label="主导航">
        <a href="#work">产品</a>
        <a href="#follow">关注</a>
      </nav>
    </header>

    <main id="top">
      <section class="hero" aria-labelledby="hero-title">
        <div class="hero-copy">
          <p class="eyebrow">NPI · Technology x Art</p>
          <h1 id="hero-title">PoppingJs</h1>
          <p class="hero-line">把科技与美术放在同一张工作台上，做从想法到产品的落地。</p>
          <div class="hero-actions" id="follow">
            <a class="button primary" href="https://www.PoppingJs.com" target="_blank" rel="noreferrer">
              关注我
              <span aria-hidden="true">↗</span>
            </a>
            <a class="button secondary" href="#work">查看产品方向</a>
          </div>
        </div>

        <div class="product-visual" aria-label="科技与美术产品视觉">
          <div class="device-shell">
            <div class="screen">
              <div class="topbar">
                <span></span>
                <span></span>
                <span></span>
              </div>
              <div class="canvas">
                <div class="grid-plane"></div>
                <div class="orbital orbital-one"></div>
                <div class="orbital orbital-two"></div>
                <div class="chip">
                  <span>01</span>
                  <strong>NPI</strong>
                </div>
                <div class="module module-tech">
                  <span>Tech</span>
                  <strong>Prototype</strong>
                </div>
                <div class="module module-art">
                  <span>Art</span>
                  <strong>Visual System</strong>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="signal-band" id="work" aria-label="个人信息">
        <article>
          <span>身份</span>
          <strong>NPI</strong>
          <p>连接研发、制造与产品体验，让新产品更快进入真实世界。</p>
        </article>
        <article>
          <span>产品</span>
          <strong>科技 · 美术</strong>
          <p>关注技术原型、视觉表达与可被感知的产品品质。</p>
        </article>
        <article>
          <span>链接</span>
          <strong>www.PoppingJs.com</strong>
          <p>从这里找到 PoppingJs 的更新、作品与后续发布。</p>
        </article>
      </section>
    </main>
  </body>
</html>
